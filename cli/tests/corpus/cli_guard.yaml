# CLI write guard corpus (v0.2 section 3). Every command runs through the real hook (scripts/cli_guard.py) under
# DEA_HOOK_PYTHON (3.9 in CI). Sections: allow = no decision, deny = permissionDecision deny, ask = ask (mode: ask).
# `mode` and `cli_allow` write a de-agent.yaml into the project dir first; `also_sql: true` also runs sql_guard (a deny from either counts).
# All names are fictional.

- section: aws
  allow:
    - aws s3 ls
    - aws s3 ls s3://acme-lake/raw/
    - aws --profile acme --region eu-west-1 s3 ls
    - aws s3 cp s3://acme-lake/raw/x.csv ./x.csv
    - aws s3 cp s3://acme-lake/raw/x.csv -
    - aws s3 sync s3://acme-lake/raw/ ./raw --exclude "*.tmp"
    - aws sts get-caller-identity
    - aws ec2 describe-instances --region eu-west-1
    - aws glue get-tables --database-name lake_raw
    - aws dms describe-replication-tasks
    - aws dms describe-table-statistics --replication-task-arn arn:aws:dms:x
    - aws athena get-query-results --query-execution-id q1
    - aws s3api head-object --bucket acme-lake --key raw/x.csv
    - aws s3api list-objects-v2 --bucket acme-lake --prefix raw/
    - aws s3api get-object --bucket acme-lake --key raw/x.csv out.csv
