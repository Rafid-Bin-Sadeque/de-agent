    - aws configure list
    - aws ec2 wait instance-running --instance-ids i-0abc
    - aws s3 presign s3://acme-lake/raw/x.csv
    - aws --version
    - aws help
    - aws s3 rm --help
    - aws redshift-data describe-statement --id s1
