    - aws s3api delete-object --bucket b --key k
    - aws s3api put-object --bucket b --key k --body f
    - aws lambda update-function-code --function-name f --zip-file fileb://f.zip
    - aws rds modify-db-instance --db-instance-identifier db1 --apply-immediately
    - aws lambda invoke --function-name f out.json
    - aws glue start-job-run --job-name j
    - aws dms start-replication-task --replication-task-arn a --start-replication-task-type resume-processing
    - aws iam attach-role-policy --role-name r --policy-arn p
    - aws sso login
    - aws sts assume-role --role-arn r --role-session-name s
    - aws ssm send-command --document-name d
    - aws configure set region eu-west-1
    - aws --profile acme --region eu-west-1 s3 rm s3://acme-lake/x
    - aws s3 sync --delete . s3://acme-lake/x

- section: aws-sql-carrying
  also_sql: true
  allow:
    - aws redshift-data execute-statement --cluster-identifier c --database dev --sql "select 1"
    - aws redshift-data batch-execute-statement --cluster-identifier c --database dev --sqls "select 1" "select 2"
    - aws athena start-query-execution --query-string "select 1"
    - aws athena get-query-execution --query-execution-id q1
  deny:
    - aws redshift-data execute-statement --cluster-identifier c --database dev --sql "drop table t"
    - aws redshift-data batch-execute-statement --cluster-identifier c --database dev --sqls "select 1" "delete from t"
    - aws athena start-query-execution --query-string "drop table t"
    - aws redshift-data cancel-statement --id s1
    - aws athena stop-query-execution --query-execution-id q1

