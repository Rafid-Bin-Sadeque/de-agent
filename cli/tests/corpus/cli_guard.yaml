  deny:
    - aws s3 rm s3://acme-lake/raw/x.csv
    - aws s3 rm s3://acme-lake/raw/ --recursive
    - aws s3 cp ./x.csv s3://acme-lake/raw/x.csv
    - aws s3 cp s3://acme-lake/a s3://acme-lake/b
    - aws s3 cp - s3://acme-lake/raw/x.csv
    - aws s3 mv s3://acme-lake/a s3://acme-lake/b
    - aws s3 mv s3://acme-lake/a ./a
    - aws s3 sync . s3://acme-lake/raw/
    - aws s3 mb s3://new-bucket
    - aws s3 rb s3://old-bucket --force
    - aws ec2 start-instances --instance-ids i-0abc
    - aws ec2 stop-instances --instance-ids i-0abc
    - aws ec2 run-instances --image-id ami-1
    - aws ec2 terminate-instances --instance-ids i-0abc
    - aws rds reboot-db-instance --db-instance-identifier db1
