version: 2
models:
  - name: stg_customers
    columns:
      - name: customer_id
        tests: [unique, not_null]
  - name: stg_orders
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: status
        tests:
          - accepted_values:
              values: [pending, paid, shipped, delivered, cancelled, refunded]
  - name: stg_order_items
    columns:
      - name: order_item_id
        tests: [unique, not_null]
  - name: stg_events
    columns:
      - name: event_id
        tests: [unique, not_null]
